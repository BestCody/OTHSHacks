name: Replace obsolete OTHacks domain

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/replace-othacks-domain.yml

permissions:
  contents: write

jobs:
  replace-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace othacks.ca with othacks.xyz
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -Il -F 'othacks.ca' || true)
          for file in "${files[@]}"; do
            perl -pi -e 's/othacks\.ca/othacks.xyz/g' "$file"
          done
          rm -- .github/workflows/replace-othacks-domain.yml

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: replace othacks.ca with othacks.xyz'
          git push
